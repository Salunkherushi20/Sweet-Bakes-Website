name: Validate static website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate all pages and interactions
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html treats.html custom-cake.html our-story.html 404.html sitemap.xml robots.txt README.md; do
            test -s "$file"
          done
          for file in index.html treats.html custom-cake.html our-story.html; do
            grep -qi '<!doctype html>' "$file"
            grep -q '<title>' "$file"
            test "$(grep -o 'name="description"' "$file" | wc -l)" -eq 1
            grep -q 'id="menuToggle"' "$file"
            grep -q 'id="navlinks"' "$file"
            grep -q 'addEventListener' "$file"
            grep -q ':focus-visible' "$file"
            grep -q "e.key==='Escape'" "$file"
          done
          grep -q 'id="enquiryForm"' custom-cake.html
          grep -q 'id="enquiryDraft"' custom-cake.html
          grep -q 'href="treats.html"' index.html
          grep -q 'href="custom-cake.html"' index.html
          grep -q 'href="our-story.html"' index.html
          grep -q '<urlset' sitemap.xml
          grep -q 'Sitemap: https://salunkherushi20.github.io/Sweet-Bakes-Website/sitemap.xml' robots.txt
          grep -q 'Page Not Found' 404.html
          echo "All pages, SEO metadata, mobile navigation, and custom enquiry draft checks passed."
