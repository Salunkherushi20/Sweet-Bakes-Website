name: Validate static website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required website pages
        run: |
          set -eu
          for file in index.html treats.html custom-cake.html our-story.html README.md; do
            test -s "$file"
          done
          for file in index.html treats.html custom-cake.html our-story.html; do
            grep -qi '<!doctype html>' "$file"
            grep -q '<title>' "$file"
            grep -q 'name="description"' "$file"
            grep -q 'id="menuToggle"' "$file"
          done
          grep -q '<form' custom-cake.html
          grep -q 'href="treats.html"' index.html
          grep -q 'href="custom-cake.html"' index.html
          echo "All multi-page website files, SEO metadata, navigation, and enquiry form found."
